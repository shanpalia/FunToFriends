workflows:
  android-workflow:
    name: Fun To Friends Android
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      android_signing:
        - paliaapk-release
      vars:
        PACKAGE_NAME: "in.callbomberz.safe"
      java: 17

    scripts:
      - name: Build debug APK
        script: |
          chmod +x ./gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.7/bin/gradle assembleDebug
          fi

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk

    publishing:
      scripts:
        - name: Build complete
          script: |
            echo "Fun To Friends APK build completed successfully."
